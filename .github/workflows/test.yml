name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: ['24', '26']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Runtime tools
        run: |
          node --version
          curl --version
          openssl version
      - name: Syntax
        run: npm run check
      - name: Unit and loopback integration tests
        run: npm test
      - name: Install command entry
        run: npm link --ignore-scripts
      - name: Command works outside the checkout
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}
        run: codex-monitor --help
      - name: Windows command works outside the checkout
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: codex-monitor.cmd --help
